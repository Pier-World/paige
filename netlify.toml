# SPA: serve index.html for client routes (Vite build output in `dist/`).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Publish full Vite output (`dist/assets/*` hashed chunks + `dist/index.html`).
[build]
  command = "npm run build"
  publish = "dist"

# Cache: avoid stale index.html pointing at removed chunks; hash-named assets are safe to cache forever.
# Netlify merges headers — later blocks win for the same header name, so `/assets/*` overrides `/*`.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
